<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情報分析工作台</title>
<meta name="description" content="預測驗證帳本的公開檢視:200 條預測鏈的機率、現況與校準結果,以及事件鍊的後果分支。">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@500;600;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/console.css">
</head>
<body>
<script src="data.js"></script>
<script src="actors.js"></script>
<script src="lineage.js"></script>
<script src="topics.js"></script>
<script src="events.js"></script>
<script src="geo.js"></script>
<script src="assets/chrome.js"></script>
<script src="assets/map.js"></script>
<script>
"use strict";
var IA=window.IA, R=IA.R, esc=IA.esc, L=IA.L;
var main=IA.chrome({section:"戰情儀表板",here:"",depth:0,
  note:"帳本現況、地理熱度、以及正在追蹤的鏈",kind:"儀表板"});

var span=IA.days(L.meta.span[0],L.meta.span[1]);
var dueSoon=R.filter(function(r){
  if(r.track!=="追蹤中"&&r.track!=="待驗證") return false;
  var d=IA.days(IA.ASOF,r.we); return d!==null&&d>=0&&d<=30;});

var kpis=[
  ["分析區間",span,"日","帳本涵蓋 "+L.meta.span[0]+" → "+L.meta.span[1],""],
  ["預測鏈",R.length,"條","追蹤中 <em>"+IA.census.追蹤中+"</em> · 休眠 <em>"+IA.census.休眠+"</em> · 狀態未記錄 <em>"+IA.census.狀態未記錄+"</em>",""],
  ["預測快照",L.meta.snapshots,"版","其中 <em>"+L.meta.unchained+"</em> 版未掛鏈根(見缺口聲明)",""],
  ["命中率",Math.round(IA.hitRate*100),"%","已計分 <em>"+IA.scored.length+"</em> 題 · Brier <em>"+IA.brier.toFixed(4)+"</em>","is-hi"],
  ["待處理",dueSoon.length,"條","驗證窗口 30 日內到期<br>待驗證 <em>"+IA.census.待驗證+"</em> 條",""]
];

/* 地理熱度:只算 geo.js 的國家清單 */
var GC={};
R.forEach(function(r){
  window.GEO.forEach(function(c){
    if(c[2].some(function(k){return r.stmt.indexOf(k)>=0;})) GC[c[0]]=(GC[c[0]]||0)+1;});
});
var NS=window.GEO_NONSTATE.map(function(c){
  return [c[0],R.filter(function(r){return c[1].some(function(k){return r.stmt.indexOf(k)>=0;});}).length,c[2]];
}).filter(function(x){return x[1];}).sort(function(a,b){return b[1]-a[1];});

var live=R.filter(function(r){return r.track==="追蹤中"||r.track==="待驗證";})
  .sort(function(a,b){return (IA.T(b.upd)||0)-(IA.T(a.upd)||0);}).slice(0,15);

var G=IA.groups();
var evSorted=G.events.slice().sort(function(a,b){return b.chains.length-a.chains.length;});
var totalBranches=G.events.reduce(function(s,e){return s+e.branches.length;},0);
var totalMulti=G.events.reduce(function(s,e){return s+e.multi.length;},0);

main.innerHTML =
 '<div class="dcl-scores">'+kpis.map(function(k){
   return '<div class="dcl-score '+k[4]+'"><span class="mk-score-k">'+k[0]+'</span>'+
     '<span class="mk-score-v">'+k[1]+'<small>'+k[2]+'</small></span>'+
     '<span class="mk-score-s">'+k[3]+'</span></div>';}).join("")+'</div>'+
 '<p class="mk-note">命中率 = 已計分鏈的結果值平均(已發生 1、部分發生 0.5、未發生 0);'+
   'Brier = 平均 (機率−結果值)²,越低越好,分母是已計分的 '+IA.scored.length+' 條而非 '+R.length+' 條。'+
   '用的是<b>最新機率</b>而非結案當下的機率——機率常在結案前才被調到接近結果,所以這個分數偏好。'+
   '上列數字全部由本頁資料即時算出,沒有一個是手寫的。</p>'+

 IA.head("事件鍊",G.events.length+" 個主要事件 · "+totalBranches+" 條後果分支 · 其中 "+totalMulti+" 條跨越至少一次結案")+
 '<div class="dcl-table-scroll"><table class="mk-t">'+
   '<thead><tr><th>主要事件</th><th>預測鏈</th><th>後果分支</th><th>多鏈分支</th><th>已計分</th></tr></thead><tbody>'+
   evSorted.map(function(e){
     return '<tr class="is-link" data-h="events/'+esc(e.id)+'/">'+
       '<td class="mk-stmt"><span class="mk-id">'+esc(e.title)+'</span></td>'+
       '<td class="mk-num">'+e.chains.length+'</td><td class="mk-num">'+e.branches.length+'</td>'+
       '<td class="mk-num">'+e.multi.length+'</td><td class="mk-num">'+e.scored.length+'</td></tr>';}).join("")+
 '</tbody></table></div>'+
 '<p class="mk-note">「事件鍊」指的是<b>事件之間的關係</b>:一個主要事件底下掛著它的後果分支,'+
 '一條分支是一串被續鏈接起來的命題。同一句命題的逐版修訂是另一件事,請看<a href="chains/">預測鏈總表</a>。</p>'+

 IA.head("預測鏈地理熱度","熱度 = 命題文字提及該國的鏈數(文字比對推得,非帳本原始欄位)")+
 '<div class="dcl-panel-flush mk-mapbox">'+
   '<canvas id="worldmap"></canvas>'+
   '<div class="mk-tip" id="maptip"><div class="n"></div><div class="d"></div></div>'+
   '<div class="mk-maplegend"><span class="mk-maplab">關聯鏈數 少</span><span class="mk-ramp"></span>'+
     '<span class="mk-maplab">多</span>'+
     '<span class="mk-maplab" style="margin-left:12px;color:var(--accent)">○ 標記＝被提及的國家</span></div>'+
 '</div>'+
 '<p class="mk-note"><b>組織、區域與海域不落在地圖上。</b>「北約」不是歐盟、「南海」不是菲律賓、'+
   '「朝鮮半島」不是韓國、「裡海」在命中的那一句裡講的是俄伊物流。'+
   '這些詞各自計數但不畫點——一顆點畫在錯的位置,讀者看不出來:'+
   NS.map(function(x){return esc(x[0])+' <em>'+x[1]+'</em>';}).join(" · ")+'</p>'+

 IA.head("追蹤中的鏈","依最後修訂排序 · 取最近 "+live.length+" 條")+
 '<div class="dcl-table-scroll"><table class="mk-t">'+
   '<thead><tr><th>鏈</th><th>陳述句</th><th>影響面</th><th>初始 → 最新</th><th>狀態</th><th>驗證窗口</th></tr></thead>'+
   '<tbody>'+live.map(function(r){
     return '<tr class="is-link is-'+IA.stCls(r)+'" data-id="'+esc(r.cid)+'">'+
       '<td><span class="mk-id">'+esc(r.cid)+'</span></td>'+
       '<td class="mk-stmt">'+esc(r.stmt)+IA.flagChips(r)+'</td>'+
       '<td>'+(r.domA.length?r.domA.map(function(d){return '<span class="dcl-domain">'+esc(d)+'</span>';}).join(""):'<span class="dcl-empty">未記錄</span>')+'</td>'+
       '<td class="mk-num">'+IA.probCell(r)+'</td>'+
       '<td><span class="mk-state is-'+IA.stCls(r)+'">'+esc(IA.stLab(r))+'</span></td>'+
       '<td class="mk-num">'+(r.ws||"未記錄")+' → '+(r.we||"未記錄")+'</td></tr>';}).join("")+
 '</tbody></table></div>';

Array.prototype.forEach.call(main.querySelectorAll("tr[data-id]"),function(tr){
  tr.addEventListener("click",function(){location.href="chains/?c="+encodeURIComponent(tr.dataset.id);});});
Array.prototype.forEach.call(main.querySelectorAll("tr[data-h]"),function(tr){
  tr.addEventListener("click",function(){location.href=tr.dataset.h;});});
window.drawGeoMap(document.getElementById("worldmap"),document.getElementById("maptip"),GC);
</script>
</body>
</html>
