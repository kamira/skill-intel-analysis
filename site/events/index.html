<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>事件鍊 — 情報分析工作台</title>
<meta name="description" content="一個主要事件,底下掛著會改變後果機率的新聞,以及它推動的每一種後果。">
<meta name="robots" content="index, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@500;600;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/console.css">
</head>
<body>
<script src="../data.js"></script>
<script src="../actors.js"></script>
<script src="../events.js"></script>
<script src="../assets/chrome.js"></script>
<script>
"use strict";
var IA=window.IA, R=IA.R, esc=IA.esc;
var main=IA.chrome({section:"事件鍊",here:"events/",depth:1,
  note:"主要事件清單",kind:"索引"});

main.innerHTML =
 IA.head("事件鍊","一個主要事件 · 底下的新聞 · 它推動的每一種後果")+
 '<div class="mk-lede"><p><b>「事件鍊」在這裡只有一個意思:一個主要事件,底下掛著會改變後果機率的新聞。</b>'+
 '同一句命題的逐版修訂是另一件事,在<a href="../chains/">預測鏈總表</a>。</p></div>'+
 '<div class="dcl-table-scroll"><table class="mk-t">'+
 '<thead><tr><th>主要事件</th><th>期間</th><th>後果分支</th><th>新聞</th><th>狀態</th></tr></thead><tbody>'+
 window.EVENTS.map(function(e){
   return '<tr class="is-link" data-h="'+esc(e.id)+'/"><td class="mk-stmt">'+
     '<span class="mk-id">'+esc(e.title)+'</span> — '+esc(e.subtitle)+'</td>'+
     '<td class="mk-num">'+e.window[0]+' → '+e.window[1]+'</td>'+
     '<td class="mk-num">'+e.outcomes.length+'</td><td class="mk-num">'+e.news.length+'</td>'+
     '<td><span class="mk-state is-open">已建</span></td></tr>';}).join("")+
 window.EVENTS_PENDING.map(function(t){
   return '<tr><td class="mk-stmt">'+esc(t)+'</td><td class="dcl-empty">—</td>'+
     '<td class="dcl-empty">—</td><td class="dcl-empty">—</td>'+
     '<td><span class="mk-state is-not-recorded">未建</span></td></tr>';}).join("")+
 '</tbody></table></div>'+
 '<p class="mk-note">其他三條列出來但不補假資料。<b>一個列了四條、其中三條是編的索引,比一條真的更糟</b>'+
 '——讀者無從分辨哪一條可信。</p>';

Array.prototype.forEach.call(main.querySelectorAll("tr[data-h]"),function(tr){
  tr.addEventListener("click",function(){location.href=tr.dataset.h;});});
</script>
</body>
</html>
