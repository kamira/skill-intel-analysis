name: pages
# CHG-20260828-02:把 site/ 發佈到 GitHub Pages。
# 站台是靜態單頁 + 一支資料檔,沒有建置步驟——直接上傳 site/ 即可。
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署;排隊中的舊 run 直接取消,但不中斷進行中的那一個。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 公開範圍的機械閘:兩道,見 .github/scope_guard.py 的檔頭。
      # CHG-20260829-02:站台由單檔改為多頁,資料檔不只 data.js,且新增了利益卡片結構檔,
      # 因此把原本寫在 workflow 裡的 grep 換成可在本機重跑的腳本。
      - name: public scope guard
        run: python3 .github/scope_guard.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
